    <script>
      (function() {
        function getDocType(fileName) {
          var ext = (fileName || '').split('.').pop().toLowerCase();
          if (['xlsx', 'xls', 'ods', 'csv', 'xltx'].indexOf(ext) !== -1) return 257;
          if (['pptx', 'ppt', 'odp', 'ppsx', 'potx'].indexOf(ext) !== -1) return 129;
          if (['pdf', 'oform'].indexOf(ext) !== -1) return 513;
          return 65; // Word / docx
        }

        function resolveLocalTemplatePath(fileRelOrUrl, docName) {
          var name = docName || (fileRelOrUrl ? fileRelOrUrl.split('/').pop().split('\\').pop() : '');
          if (!fileRelOrUrl && !name) return '';

          // 1. Direct absolute windows path
          if (fileRelOrUrl && /^[a-zA-Z]:[\\/]/.test(fileRelOrUrl)) {
            return fileRelOrUrl.replace(/\//g, '\\');
          }
          // 2. Direct file:/// URL
          if (fileRelOrUrl && fileRelOrUrl.indexOf('file:///') === 0) {
            return decodeURIComponent(fileRelOrUrl.replace(/^file:\/\/\//, '').replace(/\//g, '\\'));
          }

          // 3. Resolve relative to window.location.href (where index.html is located)
          try {
            var href = window.location.href;
            if (href.indexOf('file:///') === 0) {
              var dir = decodeURIComponent(href.replace(/^file:\/\/\//, '').replace(/\/[^/]*$/, '').replace(/\//g, '\\'));
              if (fileRelOrUrl && !fileRelOrUrl.startsWith('http')) {
                var cleanRel = fileRelOrUrl.replace(/^(\.\/|\/)/, '').replace(/\//g, '\\');
                if (cleanRel.indexOf('templates') === -1) cleanRel = 'templates\\' + cleanRel;
                return dir + '\\' + cleanRel;
              }
              if (name) {
                return dir + '\\templates\\files\\' + name;
              }
            }
          } catch(e) {}

          // 4. Default standard install directory fallback
          if (name) {
            return 'C:\\Program Files (x86)\\KaolaOffice\\templates\\files\\' + name;
          }
          return '';
        }

        window.addEventListener('message', function(event) {
          if (!event || !event.data) return;
          var data = event.data;
          if (typeof data === 'string') {
            try { data = JSON.parse(data); } catch(e) { return; }
          }
          if (data && data.type === 'openTemplate') {
            console.log('[KaolaOffice] Received openTemplate message:', data);
            var docName = data.name || (data.file ? data.file.split('/').pop() : 'Template.docx');
            var docType = data.docType || getDocType(docName);
            var localPath = data.localPath || resolveLocalTemplatePath(data.file || data.url, docName);

            var sdk = window.AscDesktopEditor;
            if (sdk && typeof sdk.execCommand === 'function' && localPath) {
              console.log('[KaolaOffice] Opening template via native execCommand create:new:', localPath, docName, docType);
              sdk.execCommand("create:new", JSON.stringify({
                template: {
                  type: docType,
                  path: localPath
                }
              }));
            } else if (sdk && typeof sdk.openTemplate === 'function' && data.url && !data.url.startsWith('file:///')) {
              console.log('[KaolaOffice] Opening remote template via sdk.openTemplate:', data.url);
              sdk.openTemplate(data.url, docName);
            } else {
              console.warn('[KaolaOffice] Unable to open template natively. localPath:', localPath, 'sdk:', !!sdk);
            }
          }
        });
      })();
