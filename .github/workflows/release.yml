name: Release Kaola Office (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Nền tảng đóng gói'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (.exe)
    if: inputs.target == 'all' || inputs.target == 'windows' || startsWith(github.ref, 'refs/tags/') || inputs.target == ''
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Download & Extract Missing ONLYOFFICE Runtime (libcef.dll)
        run: python tools/setup_runtime.py

      - name: Build Windows Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" package\kaola_setup.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaolaOffice-Windows-Setup
          path: package/Output/KaolaOffice_Setup.exe
          retention-days: 14

  build-macos:
    name: Build macOS DMGs (Apple Silicon & Intel)
    if: inputs.target == 'all' || inputs.target == 'macos' || startsWith(github.ref, 'refs/tags/') || inputs.target == ''
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install Pillow

      - name: Ensure ICNS icon is generated
        run: python3 package/mac/generate_icns.py

      - name: Build macOS DMGs
        run: |
          chmod +x package/mac/build_mac.sh
          chmod +x package/mac/fix_gatekeeper.command
          ./package/mac/build_mac.sh "all"

      - name: Upload DMG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KaolaOffice-macOS-DMG
          path: package/mac/Output/*.dmg
          retention-days: 14

  publish-and-sync:
    name: Publish GitHub Release & Sync to WordPress
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create asset output directory
        run: mkdir -p release_assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: KaolaOffice-Windows-Setup
          path: release_assets/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: KaolaOffice-macOS-DMG
          path: release_assets/

      - name: Parse Version and Tag
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release Tag: $TAG_NAME, Clean Version: $VERSION"
          ls -la release_assets/

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Kaola Office ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            release_assets/KaolaOffice_Setup.exe
            release_assets/KaolaOffice_macOS_arm64.dmg
            release_assets/KaolaOffice_macOS_x86_64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Webhook to Kaola Website (WordPress)
        env:
          KAOLA_RELEASE_SECRET: ${{ secrets.KAOLA_RELEASE_SECRET }}
          KAOLA_WEBHOOK_URL: ${{ secrets.KAOLA_WEBHOOK_URL }}
          REPO_NAME: ${{ github.repository }}
          TAG_NAME: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          WEBHOOK_URL="${KAOLA_WEBHOOK_URL:-https://kaola.vn/wp-json/kaola-rm/v1/webhook/release}"
          
          if [ -z "$KAOLA_RELEASE_SECRET" ]; then
            echo "[WARNING] KAOLA_RELEASE_SECRET secret is not configured in GitHub Repository Settings. Skipping webhook notification."
            exit 0
          fi
          
          echo "Sending release webhook to $WEBHOOK_URL for version $VERSION..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Kaola-Secret: $KAOLA_RELEASE_SECRET" \
            -d @- << EOF
          {
            "slug": "kaola-office",
            "version": "${VERSION}",
            "title": "Kaola Office ${TAG_NAME}",
            "channel": "stable",
            "changelog": "Bản phát hành tự động ${TAG_NAME} đa nền tảng (Windows x64, macOS Apple Silicon, macOS Intel).",
            "files": [
              {
                "platform": "windows_x64",
                "file_label": "Windows (64-bit)",
                "file_name": "KaolaOffice_Setup.exe",
                "file_source": "external",
                "file_url": "https://github.com/${REPO_NAME}/releases/download/${TAG_NAME}/KaolaOffice_Setup.exe"
              },
              {
                "platform": "mac_arm64",
                "file_label": "macOS (Apple Silicon M1/M2/M3/M4)",
                "file_name": "KaolaOffice_macOS_arm64.dmg",
                "file_source": "external",
                "file_url": "https://github.com/${REPO_NAME}/releases/download/${TAG_NAME}/KaolaOffice_macOS_arm64.dmg"
              },
              {
                "platform": "mac_intel",
                "file_label": "macOS (Intel x86_64)",
                "file_name": "KaolaOffice_macOS_x86_64.dmg",
                "file_source": "external",
                "file_url": "https://github.com/${REPO_NAME}/releases/download/${TAG_NAME}/KaolaOffice_macOS_x86_64.dmg"
              }
            ]
          }
          EOF
          )
          
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          
          echo "Webhook response status: $HTTP_CODE"
          echo "Webhook response body: $HTTP_BODY"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "[SUCCESS] Release synchronized to Kaola website successfully!"
          else
            echo "[ERROR] Failed to synchronize release to website (HTTP $HTTP_CODE)."
          fi
