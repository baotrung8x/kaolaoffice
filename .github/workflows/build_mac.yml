name: Build Kaola Office for macOS

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Kiến trúc CPU (arm64, x86_64, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - arm64
          - x86_64
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install Pillow

      - name: Ensure ICNS icon is generated
        run: |
          python3 package/mac/generate_icns.py

      - name: Build macOS DMGs
        run: |
          chmod +x package/mac/build_mac.sh
          chmod +x package/mac/fix_gatekeeper.command
          ARCH="${{ inputs.arch }}"
          if [ -z "$ARCH" ]; then
            ARCH="all"
          fi
          ./package/mac/build_mac.sh "$ARCH"

      - name: Upload DMG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KaolaOffice-macOS-DMG
          path: package/mac/Output/*.dmg
          retention-days: 14

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: package/mac/Output/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
